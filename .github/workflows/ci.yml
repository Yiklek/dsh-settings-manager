name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Typecheck & unit/e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Build lib/
        run: pnpm build

      - name: Run unit + e2e tests
        run: pnpm test

  playwright:
    name: Playwright functional test
    runs-on: ubuntu-latest
    # Runs only after pkg exists: it installs dsh-web-profile, which consumes the
    # plugin from the #pkg branch (so the test validates the built distribution).
    needs: [test, pkg]
    env:
      DSH_HOME: /tmp/dsh-home-pw
      DSH_PORT: "3100"
      DSH_WEB_URL: "http://127.0.0.1:3100"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps & build lib/
        run: |
          pnpm install
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Clone dsh-web-profile (base runtime comes transitively from its plugins)
        run: git clone --depth 1 https://github.com/Yiklek/dsh-web-profile.git /tmp/dsh-web-profile

      - name: Install profile via dsh-web-profile install.sh
        working-directory: /tmp/dsh-web-profile
        run: |
          ./install.sh web --mode worktree --branch ci-web --force
          echo "profile: ready at $DSH_HOME/profiles/web"

      - name: Probe dsh CLI (diagnostic)
        working-directory: ${{ env.DSH_HOME }}/profiles/web
        run: |
          echo "--- pwd ---"; pwd
          echo "--- dump-config ---"
          pnpm dlx @deepseek-ai/dsh@next --profile web --dump-config > /tmp/dump.yml 2>&1
          echo "dump exit=$?"
          echo "--- dump tail ---"; tail -15 /tmp/dump.yml

      - name: Start dsh web server
        working-directory: ${{ env.DSH_HOME }}/profiles/web
        run: |
          pnpm dlx @deepseek-ai/dsh@next --profile web --host 127.0.0.1 --port "$DSH_PORT" --no-open > /tmp/dsh-pw.log 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"
          echo "playwright: server PID=$! port=$DSH_PORT"
          code=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$DSH_WEB_URL" || true)"
            if [ "$code" = "200" ]; then echo "playwright: server up after ${i}s"; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "playwright: server died early" >&2; break; fi
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::dsh web server did not respond with 200 (last code: $code)"
            cat /tmp/dsh-pw.log
            exit 1
          fi

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npx playwright test --config playwright.config.mjs

      - name: Stop dsh web server
        if: always()
        run: |
          kill "$PID" 2>/dev/null || true
          pkill -f "dsh --profile web --host 127.0.0.1 --port $DSH_PORT" 2>/dev/null || true

      - name: Show dsh boot log on failure
        if: failure()
        run: cat /tmp/dsh-pw.log

  pkg:
    name: Build & push pkg branch
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps & build lib/
        run: |
          pnpm install
          pnpm build

      - name: Strip prepare for the pkg (distribution) branch
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));if(p.scripts&&p.scripts.prepare)delete p.scripts.prepare;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Commit lib/ + package.json and force-push pkg branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lib/ package.json
          git commit -m "pkg: rebuild lib/ for main ${{ github.sha }}"
          git branch -f pkg HEAD
          git push -f origin pkg
